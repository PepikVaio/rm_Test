name: Restore Czech diacritics

on:
  workflow_dispatch:

jobs:
  diacritics:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Clone UFAL tool
        run: |
          git clone https://github.com/ufal/bert-diacritics-restoration.git tools/ufal

      - name: Install dependencies
        run: |
          pip install torch transformers sentencepiece

      - name: Restore diacritics
        run: |
          python tools/diacritics.py

      - name: Show result
        run: |
          cat README_result.md