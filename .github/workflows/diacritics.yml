name: Restore Czech diacritics

on:
  workflow_dispatch:

jobs:
  diacritics:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install openai

      - name: Restore diacritics
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python tools/diacritics.py

      - name: Show result
        run: |
          cat README_result.md


