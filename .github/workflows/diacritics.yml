name: Restore Czech diacritics

on:
  push:

env:
  # ======================================
  # CONFIG DATA
  # ======================================
  DIACRITICS_API: http://lindat.mff.cuni.cz/services/korektor/api/correct
  DIACRITICS_MODEL: czech-diacritics_generator

  # ================================================
  # CONFIG (editable)
  # COMMIT_MESSAGE / FILE_DEFAULT: empty or message
  # ================================================
  COMMIT_MESSAGE: "Added Czech diacritics"
  FILE_DEFAULT: ""
  PATH_SCRIPT: tools/diacritics.py

permissions:
  contents: write

jobs:
  main:
    name: 'Adding diacritics to an *md file'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install requests
      - name: Add diacritics
        run: |
          python ${{ env.PATH_SCRIPT }}
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "${{ env.COMMIT_MESSAGE }}"
          git push