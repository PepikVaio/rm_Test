name: Restore Czech diacritics

on:
  workflow_dispatch:
    inputs:
      file:
        description: "Soubor pro opravu (prázdné = všechny .md)"
        required: false
        default: ""

env:
  DIACRITICS_MODEL: czech-diacritics_generator
  DIACRITICS_API: http://lindat.mff.cuni.cz/services/korektor/api/correct
  DEFAULT_EXTENSION: "*.md"

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Restore diacritics
        env:
          FILE: ${{ github.event.inputs.file }}
        run: |
          python tools/diacritics.py

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Restore Czech diacritics"
          git push