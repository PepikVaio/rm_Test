name: Restore Czech diacritics

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Restore Czech diacritics
        run: |
          curl \
            --data-urlencode "data@README.md" \
            --data-urlencode "model=czech-diacritics_generator" \
            http://lindat.mff.cuni.cz/services/korektor/api/correct \
          | python3 -c '
import sys, json
print(json.load(sys.stdin)["result"])
' > README.new.md

          mv README.new.md README.md

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Restore Czech diacritics"
          git push