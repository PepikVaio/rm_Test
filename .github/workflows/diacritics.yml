name: Restore Czech diacritics

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore diacritics
        run: |
          curl \
            --data-urlencode "data@README.md" \
            --data-urlencode "model=czech-diacritics_generator" \
            http://lindat.mff.cuni.cz/services/korektor/api/correct \
            -o result.json

          python3 - <<'PY'
          import json

          with open("result.json", encoding="utf-8") as f:
              data = json.load(f)

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(data["result"])
          PY

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Restore Czech diacritics"
          git push