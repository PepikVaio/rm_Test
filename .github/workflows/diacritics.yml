name: Doplnit diakritiku v README

on:
  workflow_dispatch:
  push:
    paths:
      - README.raw.md

permissions:
  contents: write

jobs:
  diacritics:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Doplnit diakritiku přes Korektor
        run: |
          curl \
            --data-urlencode "data@README.raw.md" \
            --data-urlencode "model=czech-diacritics_generator" \
            http://lindat.mff.cuni.cz/services/korektor/api/correct \
          | python3 -c '
import sys, json
print(json.load(sys.stdin)["result"])
' > README.md

      - name: Commit změn
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "Žádné změny."
            exit 0
          fi

          git commit -m "Automaticky doplněna diakritika"
          git push