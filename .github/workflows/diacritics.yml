name: Restore Czech text and translate

on:
  push:

env:
  # ======================================
  # CONFIG DATA
  # ======================================
  DIACRITICS_API: http://lindat.mff.cuni.cz/services/korektor/api/correct
  DIACRITICS_MODEL: czech-diacritics_generator

  # ================================================
  # CONFIG (editable)
  # COMMIT_MESSAGE / FILE_DEFAULT: empty or message
  # ================================================
  COMMIT_MESSAGE: "Added Czech diacritics"
  FILE_DEFAULT: ""
  PATH_DIACRITICS: .tools/diacritics.py
  PATH_REQUIREMENTS: .tools/translate.py
  PATH_TRANSLATE: .tools/translate.py


  # ======================================
  # TRANSLATION
  # ======================================

  TRANSLATE_MODEL: Helsinki-NLP/opus-mt-cs-en
  TRANSLATE_SOURCE: README.cs.md
  TRANSLATE_OUTPUT: README.md



permissions:
  contents: write

jobs:
  main:
    name: 'Restore Czech text and translate'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python ${{ env.PATH_REQUIREMENTS }}
      - name: Install dependencies
        run: |
          pip install -r ${{ env.PATH_REQUIREMENTS }}
      - name: Add diacritics
        run: |
          python ${{ env.PATH_DIACRITICS }}
      - name: Translate to English
        run: |
          python ${{ env.PATH_TRANSLATE }}
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "${{ env.COMMIT_MESSAGE }}"
          git push
