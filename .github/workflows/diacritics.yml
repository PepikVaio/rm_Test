name: Doplnit diakritiku v README

on:
  workflow_dispatch:
  push:
    paths:
      - 'README.raw.md'   # zdrojový soubor bez diakritiky

jobs:
  diacritics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Doplnit diakritiku přes Korektor API
        run: |
          RESULT=$(curl -s --data-urlencode "data=$(cat README.raw.md)" \
            --data-urlencode 'model=czech-diacritics_generator' \
            http://lindat.mff.cuni.cz/services/korektor/api/correct \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['result'])")
          echo "$RESULT" > README.md

      - name: Commit výsledek
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: doplnit diakritiku v README"
          git push