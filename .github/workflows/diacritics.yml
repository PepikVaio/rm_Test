name: Restore Czech text and translate

on:
  push:
    paths:
      - "**.md"

permissions:
  contents: write

jobs:
  tools:
    name: Run reMarkable tools
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run tools
        uses: PepikVaio/reMarkable_Github_Actions@main
        with:
          run_diacritics: true
          run_translate: true